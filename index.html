<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planning" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <title>Planning</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body { background: #F2F2F7; }
      body.ready { transition: background 0.3s; }
      body.dark { background: #000000; }
      #root { height: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      input, textarea { font-size: 16px; }
      /* Changement de mois : le mois change immédiatement, puis le nouveau mois apparaît en fondu */
      @keyframes monthFromRight { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
      @keyframes monthFromLeft { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
      .month-in-right { animation: monthFromRight 0.18s ease-out; }
      .month-in-left { animation: monthFromLeft 0.18s ease-out; }
      /* Réglage iPhone « Réduire les animations » : pas de glissement ni de fondu */
      @media (prefers-reduced-motion: reduce) {
        .month-in-right, .month-in-left { animation: none; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
